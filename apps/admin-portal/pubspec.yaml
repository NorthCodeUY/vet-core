# apps/admin-portal/pubspec.yaml

name: admin_portal
description: "Portal Administrativo Multi-Tenant de VetCore."
publish_to: 'none'

version: 1.0.0+1

environment:
   sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Localización oficial (Español y formatos regionales)
  flutter_localizations:
    sdk: flutter

  # Iconografía base
  cupertino_icons: ^1.0.8

  # Gestión de estado e Inyección de Dependencias
  flutter_riverpod: ^3.4.3
  provider: ^6.1.5+1

  # Comunicación HTTP con FastAPI
  dio: ^5.11.1

  # Navegación y Enrutamiento declarativo
  go_router: ^18.1.0

  # Persistencia segura de tokens JWT y credenciales
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # Optimización y renderizado de imágenes y logotipos
  cached_network_image: ^4.0.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # REGISTRO DINÁMICO DE ASSETS POR TENANT: Permite cargar config.json y logotipos del cliente
  assets:
    - assets/tenant/