<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VetCore — Suite de Gestión Visual de Tenants</title>
  
  <!-- Tailwind CSS CDN para renderizado en tiempo real -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Inyección de tokens semánticos por defecto */
    :root {
      --vete-primary: 39 93 158;
      --vete-primary-hover: 30 75 130;
      --vete-secondary: 218 235 212;
      --vete-tertiary: 31 175 56;
      --vete-dark: 253 253 241;
      --vete-surface: 255 255 255;
      --vete-soft: 100 147 83;
      --vete-overlay: 0 0 0;
      --vete-text-base: 0 0 0;
      --vete-text-muted: 100 116 139;
      --vete-border-subtle: 226 232 240;
      --vete-error: 220 38 38;
    }

    /* Scrollbar estilizado para la suite */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #020617; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>

  <script>
    // Configuración Tailwind alineada con apps/web-client/tailwind.config.js
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vete: {
              primary: 'rgb(var(--vete-primary) / <alpha-value>)',
              'primary-hover': 'rgb(var(--vete-primary-hover) / <alpha-value>)',
              secondary: 'rgb(var(--vete-secondary) / <alpha-value>)',
              tertiary: 'rgb(var(--vete-tertiary) / <alpha-value>)',
              dark: 'rgb(var(--vete-dark) / <alpha-value>)',
              surface: 'rgb(var(--vete-surface) / <alpha-value>)',
              soft: 'rgb(var(--vete-soft) / <alpha-value>)',
              overlay: 'rgb(var(--vete-overlay) / <alpha-value>)',
              'text-base': 'rgb(var(--vete-text-base) / <alpha-value>)',
              'text-muted': 'rgb(var(--vete-text-muted) / <alpha-value>)',
              'border-subtle': 'rgb(var(--vete-border-subtle) / <alpha-value>)',
              error: 'rgb(var(--vete-error) / <alpha-value>)',
            }
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-emerald-500 selection:text-white">

  <!-- =========================================================================
       1. CABECERA GLOBAL DE CONTROL
       ========================================================================= -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 py-3.5 flex flex-col md:flex-row justify-between items-center gap-4 shadow-2xl">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-emerald-600/20 text-emerald-400 rounded-xl font-black text-lg border border-emerald-500/20">⚡</div>
      <div>
        <h1 class="text-sm font-bold text-white flex items-center gap-2">
          VetCore Studio <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700">Multi-tenant Engine</span>
        </h1>
        <p id="file-status" class="text-[11px] text-slate-400 font-mono">Inicializando entorno...</p>
      </div>
    </div>

    <!-- Barra de Herramientas -->
    <div class="flex flex-wrap items-center gap-2.5">
      <!-- Cargar archivo externo -->
      <label class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs transition-all border border-slate-700 cursor-pointer flex items-center gap-1.5">
        📂 Abrir JSON
        <input type="file" id="json-file-input" accept=".json" class="hidden" onchange="handleImportJSON(event)" />
      </label>

      <button onclick="loadConfigFile()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs transition-all border border-slate-700 flex items-center gap-1.5">
        🔄 Recargar
      </button>

      <button onclick="copyGeneratedJSON()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs transition-all shadow-md flex items-center gap-1.5">
        📋 Copiar JSON
      </button>

      <button onclick="downloadJSONFile()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition-all shadow-md flex items-center gap-1.5">
        💾 Descargar config.json
      </button>
    </div>
  </header>

  <!-- =========================================================================
       2. WORKSPACE DE DOBLE PANEL (FORMULARIO vs PREVIEW)
       ========================================================================= -->
  <div class="max-w-[1850px] mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- PANEL IZQUIERDO: FORMULARIO MODULAR -->
    <div class="lg:col-span-5 bg-slate-900 p-6 rounded-3xl border border-slate-800 space-y-6 h-[88vh] overflow-y-auto pr-3 shadow-xl">
      
      <!-- SUB-COMPONENTE: Identidad y Eslogan -->
      <div id="mount-identity-section"></div>

      <!-- SUB-COMPONENTE: Paleta de Colores (Theme) -->
      <div id="mount-theme-section"></div>

      <!-- SUB-COMPONENTE: Variantes de UI y Features -->
      <div id="mount-variants-features-section"></div>

      <!-- SUB-COMPONENTE: Galería de Assets Multimedia -->
      <div id="mount-assets-section"></div>

      <!-- SUB-COMPONENTE: Hero Session -->
      <div id="mount-hero-section"></div>

      <!-- SUB-COMPONENTE: Servicios -->
      <div id="mount-services-section"></div>

      <!-- SUB-COMPONENTE: Planes y Membresías -->
      <div id="mount-plans-section"></div>

      <!-- SUB-COMPONENTE: Trabajos Realizados (Portfolio) -->
      <div id="mount-portfolio-section"></div>

      <!-- SUB-COMPONENTE: Ubicación y Contacto -->
      <div id="mount-contact-section"></div>

    </div>

    <!-- PANEL DERECHO: LIVE PREVIEW REACTIVO FIDEDIGNO -->
    <div class="lg:col-span-7 space-y-6 h-[88vh] overflow-y-auto pr-2">
      <div class="flex items-center justify-between">
        <span class="text-xs font-black uppercase text-slate-400 tracking-wider flex items-center gap-2">
          🖥️ Vista Previa en Vivo (Reflejo del DOM de Producción)
        </span>
        <span id="preview-indicator" class="text-[10px] bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/30">
          ● Sincronizado en Tiempo Real
        </span>
      </div>

      <!-- SIMULADOR DE PANTALLA -->
      <div class="border border-slate-800 rounded-3xl overflow-hidden shadow-2xl bg-vete-dark transition-colors duration-300">
        <!-- 1. Header Preview -->
        <div id="preview-header-container"></div>

        <!-- 2. Hero Preview -->
        <div id="preview-hero-container"></div>

        <!-- 3. Services Preview -->
        <div id="preview-services-container"></div>

        <!-- 4. Plans Preview -->
        <div id="preview-plans-container"></div>

        <!-- 5. Portfolio Preview -->
        <div id="preview-portfolio-container"></div>

        <!-- 6. Location / Map Preview -->
        <div id="preview-location-container"></div>

        <!-- 7. Footer Preview -->
        <div id="preview-footer-container"></div>
      </div>
    </div>

  </div>

  <script src="./generator.js"></script>
</body>
</html>
