# api-backend/docker-compose.yml
services:
  postgres-cluster:
    image: postgres:15
    container_name: vetcore_postgres_cluster
    restart: always
    environment:
      POSTGRES_USER: ary
      POSTGRES_PASSWORD: hmq7381
      POSTGRES_DB: default_db
      POSTGRES_MULTIPLE_DATABASES: vet_beltramelli_db,flor_de_loto_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_cluster_data:/var/lib/postgresql/data
      - ./init-scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    networks:
      - northcode-net

  backend-veterinaria:
    build: .
    container_name: backend_vet_beltramelli
    restart: always
    ports:
      - "8001:8001"
    env_file:
      - .env.veterinaria
    depends_on:
      - postgres-cluster
    volumes:
      - ./app:/app/app
      - ./static/veterinaria:/app/static
    networks:
      - northcode-net

  backend-flordeloto:
    build: .
    container_name: backend_vestimenta_flordeloto
    restart: always
    ports:
      - "8002:8002"
    env_file:
      - .env.flordeloto
    depends_on:
      - postgres-cluster
    volumes:
      - ./app:/app/app
      - ./static/flordeloto:/app/static
    networks:
      - northcode-net

networks:
  northcode-net:
    external: true

volumes:
  postgres_cluster_data:
    external: true