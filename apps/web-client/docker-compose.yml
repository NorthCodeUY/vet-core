# /apps/web-client/docker-compose.yml

networks:
  northcode-net:
    external: true

# Configuración base de construcción local
x-frontend-base: &frontend-build
  build:
    context: .
    dockerfile: dockerfile
  image: vetcore-web-client:latest

services:
  # ===========================================================================
  # CLIENTE 1: Valeria Beltramelli (Frontend + Backend activo)
  # ===========================================================================
  front-valeria:
    <<: *frontend-build
    container_name: nc-web-valeria
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - BACKEND_HOST=backend-vet-bel:8000
    volumes:
      - ../../clients/valeria_beltramelli/config.json:/usr/share/nginx/html/config/client_info.json:ro
      - ../../clients/valeria_beltramelli/assets:/usr/share/nginx/html/tenant:ro
    networks:
      - northcode-net

  # ===========================================================================
  # CLIENTE 2: Malandro Barber (Frontend Standalone / Sin Backend)
  # ===========================================================================
  front-malandrobarber:
    <<: *frontend-build
    container_name: nc-web-malandrobarber
    restart: unless-stopped
    ports:
      - "8082:80"
    environment:
      - BACKEND_HOST=127.0.0.1:80
    volumes:
      - ../../clients/malandrobarber/config.json:/usr/share/nginx/html/config/client_info.json:ro
      - ../../clients/malandrobarber/assets:/usr/share/nginx/html/tenant:ro
    networks:
      - northcode-net

  # ===========================================================================
  # CLIENTE 3: Flor de Loto (Frontend Standalone / Tienda)
  # ===========================================================================
  front-flordeloto:
    <<: *frontend-build
    container_name: nc-web-flordeloto
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      - BACKEND_HOST=127.0.0.1:80
    volumes:
      # Sangría corregida y carácter 'º' eliminado
      - ../../clients/flordeloto/config.json:/usr/share/nginx/html/config/client_info.json:ro
      - ../../clients/flordeloto/assets:/usr/share/nginx/html/tenant:ro
    networks:
      - northcode-net