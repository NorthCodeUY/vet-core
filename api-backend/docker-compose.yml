# api-backend/docker-compose.yml

services:

  # ---------------------------------------------------------------------------
  # MOTOR POSTGRESQL (CLÚSTER CENTRALIZADO)
  # Consume variables desde el archivo .env raíz
  # ---------------------------------------------------------------------------
  db-vet_bel:
    image: postgres:15
    container_name: vet_db_bel
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      # Expuesto al host local para desarrollo (comentar en VPS de producción)
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_vet_bel:/var/lib/postgresql/data
    networks:
      - northcode-net

  # ---------------------------------------------------------------------------
  # TENANT 1: BACKEND VETERINARIA BELTRAMELLI
  # Consume variables exclusivamente de .env.veterinaria
  # ---------------------------------------------------------------------------
  backend-veterinaria:
    build: .
    container_name: backend_vet_beltramelli
    restart: always
    # Puertos no expuestos al host: la comunicación se hace vía DNS Docker (northcode-net)
    # ports:
    #   - "8001:8001"
    env_file:
      - .env.veterinaria
    depends_on:
      - db-vet_bel
    volumes:
      - ./app:/app/app
      - ./static/veterinaria:/app/static
    networks:
      - northcode-net

  # ---------------------------------------------------------------------------
  # TENANT 2: BACKEND VESTIMENTA FLOR DE LOTO
  # Consume variables exclusivamente de .env.flordeloto
  # ---------------------------------------------------------------------------
  backend-flordeloto:
    build: .
    container_name: backend_vestimenta_flordeloto
    restart: always
    # ports:
    #   - "8002:8002"
    env_file:
      - .env.flordeloto
    depends_on:
      - db-vet_bel
    volumes:
      - ./app:/app/app
      - ./static/flordeloto:/app/static
    networks:
      - northcode-net

# -----------------------------------------------------------------------------
# DEFINICIONES GLOBALES DE INFRAESTRUCTURA
# -----------------------------------------------------------------------------
networks:
  northcode-net:
    external: true

volumes:
  postgres_data_vet_bel:
    # Vincula con el volumen ya existente en tu Docker daemon
    external: true
    name: api-backend_postgres_data_vet_bel